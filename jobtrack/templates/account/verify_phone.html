{% extends "base.html" %}

{% block title %}Verify your number{% endblock %}

{% block content %}
<h1 class="page-title">Verify your number</h1>

<section class="panel narrow-panel">
    <p>We texted a 6-digit code to <strong>{{ display_phone(phone) }}</strong>. Enter it to link this
        number to your account. It works for 10 minutes.</p>

    <form method="POST" class="code-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="code">6-digit code</label>
        <input type="text" id="code" name="code" class="code-input"
               inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*"
               maxlength="7" placeholder="123456" required autofocus>
        <button class="btn" type="submit">Verify number</button>
    </form>

    <form method="POST" action="{{ url_for('phone.add_phone') }}" class="resend-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="phone" value="{{ phone }}">
        <span class="muted">No text?</span>
        <button class="link-button" type="submit">Send a new code</button>
        <span class="muted">or</span>
        <a href="{{ url_for('account.settings') }}#phone">use a different number</a>
    </form>
</section>
{% endblock %}

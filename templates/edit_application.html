<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Application | JobTrack</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <nav class="navbar">

        <h2>JobTrack</h2>

        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/applications/add">Add Application</a>
            <a href="/logout">Logout</a>
        </div>

    </nav>


    <div class="form-container">

        <h1>Edit Application</h1>

        <form method="POST">

            <div class="form-group">

                <label>Company</label>

                <input
                    type="text"
                    name="company"
                    value="{{ application['company'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Job Title</label>

                <input
                    type="text"
                    name="job_title"
                    value="{{ application['job_title'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Location</label>

                <input
                    type="text"
                    name="location"
                    value="{{ application['location'] or '' }}"
                >

            </div>


            <div class="form-group">

                <label>Job URL</label>

                <input
                    type="url"
                    name="job_url"
                    value="{{ application['job_url'] or '' }}"
                >

            </div>


            <div class="form-group">

                <label>Date Applied</label>

                <input
                    type="date"
                    name="date_applied"
                    value="{{ application['date_applied'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Status</label>

                <select name="status">

                    <option value="Applied"
                        {% if application['status'] == 'Applied' %}selected{% endif %}>
                        Applied
                    </option>

                    <option value="Interview"
                        {% if application['status'] == 'Interview' %}selected{% endif %}>
                        Interview
                    </option>

                    <option value="Offer"
                        {% if application['status'] == 'Offer' %}selected{% endif %}>
                        Offer
                    </option>

                    <option value="Rejected"
                        {% if application['status'] == 'Rejected' %}selected{% endif %}>
                        Rejected
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Notes</label>

                <textarea
                    name="notes"
                    placeholder="Add notes about this application..."
                >{{ application['notes'] or '' }}</textarea>

            </div>


            <button class="btn" type="submit">
                Update Application
            </button>

            <a class="btn btn-secondary" href="/dashboard">
                Cancel
            </a>

        </form>

    </div>

</body>

</html>

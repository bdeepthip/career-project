{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="flash flash-{{ category if category in ('success', 'error') else 'info' }}"
             role="{{ 'alert' if category == 'error' else 'status' }}">
            {{ message }}
        </div>
    {% endfor %}
{% endwith %}

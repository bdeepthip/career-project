{% extends "base.html" %}

{% block title %}Log in{% endblock %}
{% block main_class %}auth-page{% endblock %}

{% block content %}

<div class="auth-card">

    <div class="auth-logo">
        <h1>Welcome back</h1>
        <p>Log in to continue tracking your applications.</p>
    </div>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}"
                   placeholder="you@example.com" autocomplete="email" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Your password" autocomplete="current-password" required>
        </div>

        <button class="btn" type="submit">Log in</button>
    </form>

    <div class="auth-footer">
        Don't have an account?
        <a href="{{ url_for('auth.register') }}">Create one</a>
    </div>

</div>

{% endblock %}

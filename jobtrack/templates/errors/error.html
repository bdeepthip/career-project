{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<div class="error-page">
    {% if code %}<p class="error-code" aria-hidden="true">{{ code }}</p>{% endif %}
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="error-actions">
        {% if g.user %}
        <a class="btn" href="{{ url_for('applications.dashboard') }}">Go to your dashboard</a>
        {% else %}
        <a class="btn" href="{{ url_for('auth.home') }}">Go to Roleflow home</a>
        {% endif %}
    </div>
</div>

{% endblock %}

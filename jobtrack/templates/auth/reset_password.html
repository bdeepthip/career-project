{% extends "auth/_layout.html" %}

{% block title %}Choose a new password{% endblock %}
{% block auth_heading %}Choose a new password{% endblock %}
{% block auth_lead %}This signs you out on every device.{% endblock %}

{% block auth_form %}
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" minlength="8"
               placeholder="At least 8 characters" autocomplete="new-password" required autofocus>
    </div>
    <div class="form-group">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="8"
               autocomplete="new-password" required>
    </div>
    <button class="btn btn-block" type="submit">Reset password</button>
</form>
{% endblock %}
